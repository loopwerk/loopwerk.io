# Content negotiation for agents: requests with "Accept: text/markdown" get an article's
# index.md twin (falling back to index.html for pages without one). Cloudflare only keys
# its cache on the Accept header because of a Cache Rule on the zone with the Vary setting:
# accept = normalize with media types [text/html, text/markdown], accept-encoding = normalize,
# default = bypass. Without that rule, one cached variant would be served to everyone.
map $http_accept $negotiated_index {
    default           "index.html";
    "~*text/markdown" "index.md";
}

# Extends the stock mime.types table, which has no .md entry
types {
    text/markdown md;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index $negotiated_index index.html;

    # Markdown has no in-band charset declaration, so append it to the Content-Type.
    charset utf-8;
    charset_types text/html text/xml text/plain text/vnd.wap.wml application/javascript application/rss+xml text/markdown;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # Custom 404 error page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Don't allow the site to be embedded in an iframe
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Cache HTML at edge (purge via Cloudflare API on deploy)
    etag on;
    add_header Cache-Control "public, max-age=0, s-maxage=31536000, must-revalidate";

    # Pages are negotiated on the Accept header, so caches must key on it
    add_header Vary "Accept" always;

    # Static assets: cache for 1 year (they're hashed or rarely change)
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Feeds: short edge cache as a safety net. If a CloudFlare cache purge ever fails, 
    # this keeps a stale copy alive for 5 minutes instead of the full year.
    location ~ feed\.xml$ {
        add_header Cache-Control "public, max-age=0, s-maxage=300, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Redirects
    rewrite ^/apps/$ /work/ permanent;
    rewrite ^/projects/$ /open-source/ permanent;
    rewrite "^/articles/([0-9]{4})/[0-9]{2}/[0-9]{2}/(.+)$" /articles/$1/$2 permanent;
    rewrite ^/articles/2025/announding-rssfilter-com/$ /articles/2025/announcing-rssfilter-com/ permanent;
    rewrite ^/articles/2025/coolify-django-db-migrations/$ /articles/2025/safe-django-db-migrations/ permanent;

    location /script.js {
        proxy_pass https://umami.loopwerk.io/script.js;
        proxy_set_header Host umami.loopwerk.io;
        proxy_ssl_server_name on;
        proxy_buffering on;
    }

    location /api/send {
        proxy_pass https://umami.loopwerk.io/api/send;
        proxy_set_header Host umami.loopwerk.io;
        proxy_ssl_server_name on;
        proxy_buffering on;
        proxy_set_header X-Client-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
